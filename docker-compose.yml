# x- keys are ignored by Compose; the anchors let api and api-public share one definition, so the
# two profiles cannot drift apart. `environment` is a separate anchor because `<<` merges only one
# level deep: each service's own `environment` would otherwise replace the shared one outright.
x-api-env: &api-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Same URL-encoding caveat as migrate below; settings.py is where that gets fixed.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
  REDIS_URL: redis://redis:6379/0
  # The API judges the worker canary's staleness, Beat schedules it: one variable feeds both, so they
  # cannot disagree about how often it runs (app/settings.py).
  CANARY_INTERVAL_SECONDS: ${CANARY_INTERVAL_SECONDS:-60}
  # The longest any task may run (Celery kills it past this). The API judges the ingest worker's canary
  # against it, the workers enforce it: one variable, so they cannot disagree (app/settings.py).
  INGEST_TASK_MAX_SECONDS: ${INGEST_TASK_MAX_SECONDS:-1800}
  # How old the last backup may be before /health/data calls it stale (it never touches /health/ready).
  BACKUP_STALE_AFTER_HOURS: ${BACKUP_STALE_AFTER_HOURS:-36}
  # The fake provider (M2 slice 4): OFF unless FAKE_PROVIDER_ENABLED=true. The API judges its feed, Beat
  # schedules it and the worker runs it, so all three read these same variables (app/settings.py).
  # The settled bars polls (M2 slice 6, step 6): Beat schedules them only when true. OFF until IDEA-029
  # closes (slice 2's restore drill from the real desktop); a manual `celery call` works either way.
  BARS_POLL_ENABLED: ${BARS_POLL_ENABLED:-false}
  FAKE_PROVIDER_ENABLED: ${FAKE_PROVIDER_ENABLED:-false}
  FAKE_PROVIDER_MODE: ${FAKE_PROVIDER_MODE:-ok}
  FAKE_PROVIDER_INTERVAL_SECONDS: ${FAKE_PROVIDER_INTERVAL_SECONDS:-60}
  FAKE_PROVIDER_SLOW_SECONDS: ${FAKE_PROVIDER_SLOW_SECONDS:-60}
  INGEST_RETRY_INITIAL_SECONDS: ${INGEST_RETRY_INITIAL_SECONDS:-1}

# The Postgres image is defined once, here. The backup container is built FROM it so its pg_dump is the
# server's own version, and records it in each manifest (the version trap, docs/BACKUP.md).
x-postgres-image: &postgres-image timescale/timescaledb:2.31.0-pg16

x-api-base: &api-base
  build: ./backend
  # DECISION: no depends_on, on purpose. /health/live must stay up when Postgres or Redis
  # are down, and /health/ready reports their state (slice 6) rather than the API refusing
  # to start. Loopback only, like Postgres (M1 exit gate).
  ports:
    - "127.0.0.1:${API_PORT:-8000}:8000"
  # One name for whichever of api / api-public is running, so the heartbeat sender needn't know.
  networks:
    default:
      aliases: [api-upstream]
  restart: unless-stopped

services:
  postgres:
    # DECISION: exact tag, not latest-pg16. Verified with `docker buildx imagetools inspect`
    # to publish linux/amd64 and linux/arm64 (§13 targets an Oracle ARM VM).
    image: *postgres-image
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only: host psql works, nothing is exposed externally (M1 exit gate).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # DECISION: -h 127.0.0.1 forces TCP. The entrypoint's temporary init server listens on
      # the unix socket only, so a socket check can report healthy before init has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    # DECISION: exact tag; amd64 + arm64/v8 verified. No persistence and no host port:
    # Redis is never the source of truth (Postgres is). Reach it with `docker compose exec redis`.
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Exactly one of the two API services runs (§14: "choose one; set by compose profile").
  # COMPOSE_PROFILES=private in .env keeps `docker compose up -d` the one command. Both publish
  # the same host port on purpose: enabling both profiles fails on the bind, not silently.
  api:
    <<: *api-base
    profiles: [private]
    environment:
      <<: *api-env
      DEPLOYMENT_MODE: private

  api-public:
    <<: *api-base
    # DECISION: loopback like everything else. The public profile is NOT internet-ready after
    # slice 7: strict CORS, request-size limits and rate limits do not exist yet (IDEA-019 addendum).
    profiles: [public]
    environment:
      <<: *api-env
      DEPLOYMENT_MODE: public

  migrate:
    # DECISION: a one-shot service, not a dependency of `api`. /health/live must stay up when
    # Postgres is down (slice 2), so the API never waits on migrations; slice 6's /health/ready
    # will report "migrations not applied" instead. restart "no" because it exits 0 by design.
    # DATABASE_URL is assembled here; a password with URL-reserved characters must be encoded.
    build: ./backend
    # M2 slice 3: after the migrations, seed the reference tables and extend trading sessions
    # (python -m app.seed). Idempotent and insert-only, so every `up` is safe. A seeding failure
    # fails this service, which is the loud outcome we want; seeding drift is only logged.
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
      # The seed registers each declared feed in providers_health (IDEA-026), so it needs to know
      # whether the fake's feed is declared.
      FAKE_PROVIDER_ENABLED: ${FAKE_PROVIDER_ENABLED:-false}
      FAKE_PROVIDER_INTERVAL_SECONDS: ${FAKE_PROVIDER_INTERVAL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Celery worker and Beat (M2 slice 1). No profile: they run under private and public alike. No
  # depends_on, like the API: Redis and Postgres being down is a state the health endpoints report,
  # and Celery retries the broker connection (broker_connection_retry_on_startup) instead of exiting.
  # No ports. The image's HEALTHCHECK probes port 8000, which nothing serves here, so it is disabled
  # as for the heartbeat sender. The health signal for these two is the canary in task_runs, read by
  # /health/ready: a process being up says nothing about whether it is working.
  #
  # Two workers on two queues (M2 slice 5, step 0). One worker on one queue meant a long backfill could
  # hold every slot, the canary would queue behind it, and /health/ready would page as if the worker
  # had died. `worker-ops` takes the `ops` queue and nothing else, so nothing can make the canary wait;
  # `worker` takes `ingest`, the default for every other task. Each has a canary and each is judged by
  # /health/ready (checks.worker and checks.ingest_worker). `-n` gives each a distinct node name.
  worker:
    build: ./backend
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "ingest", "-n", "ingest@%h"]
    environment:
      <<: *api-env
      # FRED credentials go to the process that calls FRED and to no other: never into x-api-env, which
      # api and api-public share (api-public is the one that may one day face the internet).
      FRED_API_KEY: ${FRED_API_KEY:-}
      FRED_USER_AGENT: ${FRED_USER_AGENT:-}
      FRED_BASE_URL: ${FRED_BASE_URL:-}
    healthcheck:
      disable: true
    restart: unless-stopped

  worker-ops:
    build: ./backend
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO", "--concurrency=1", "-Q", "ops", "-n", "ops@%h"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    restart: unless-stopped

  beat:
    build: ./backend
    # The schedule file is on a named volume (IDEA-043, 2026-11-15). In /tmp, a recreated container forgot when
    # each entry last ran and SKIPPED a firing it missed while down; on a volume it runs the missed entry. A price
    # bar missed that way is not recovered by the next run, unlike a FRED poll. /var/lib/beat is created and
    # owned by uid 10001 in backend/Dockerfile (a compose-only fix dies with Errno 13).
    # Beat catching up is NOT a gap check: it runs a missed entry once. Slice 7 must detect gaps in the data.
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=INFO", "--schedule=/var/lib/beat/celerybeat-schedule"]
    volumes:
      - beat_schedule:/var/lib/beat
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    restart: unless-stopped

  # Scheduled, encrypted backups with an off-box copy (M2 slice 2, IDEA-029). A container, like the
  # heartbeat sender, so that what it does is recorded in task_runs and visible on /health/data: a host
  # scheduler would be a second system none of our machinery sees. No ports, no profile, no depends_on
  # (Postgres being down is a failed attempt that is retried, not a reason to refuse to start).
  # What it needs from you, all in .env and all outside git: docs/BACKUP.md.
  backup:
    build:
      context: ./infra/backup
      args:
        POSTGRES_IMAGE: *postgres-image
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGDATABASE: ${POSTGRES_DB:?set in .env}
      POSTGRES_IMAGE: *postgres-image
      TZ: ${BACKUP_TZ:-America/New_York}
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_RETRY_MINUTES: ${BACKUP_RETRY_MINUTES:-15}
      # DECISION: two caps, split by whether a retry can help (lib.sh, exit_code_for_class). A destination that
      # cannot be reached is retried within 30 minutes: a laptop that leaves home for the workday burns through a
      # 6-hour backoff, and the copy would then land hours after it returns. Everything else (a failing dump, a
      # refused key) backs off to 6 hours. A configuration problem (no recipient key, a bad setting) is not
      # retried before the next slot. A container restart retries at once.
      BACKUP_RETRY_CAP_MINUTES: ${BACKUP_RETRY_CAP_MINUTES:-30}
      BACKUP_RETRY_LONG_CAP_MINUTES: ${BACKUP_RETRY_LONG_CAP_MINUTES:-360}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      # The off-box copy to Backblaze B2 (2026-11-25; docs/BACKUP.md). Blank bucket = no off-box copy: recorded
      # as not_configured on /health/data, never as a success. The key ID and key are SECRETS: .env only.
      B2_BUCKET: ${B2_BUCKET:-}
      B2_ENDPOINT: ${B2_ENDPOINT:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
      # The bucket's default retention, which the copy checks every upload against; set on the bucket, not here.
      B2_LOCK_DAYS: ${B2_LOCK_DAYS:-30}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    volumes:
      # The encrypted backups kept locally. `docker compose down -v` wipes them with the database; the
      # off-box copy is what survives that.
      - backups:/backups
      # Long syntax, because a Windows path like C:/Users/... breaks the short form's colon parsing.
      - type: bind
        source: ${BACKUP_RECIPIENTS_FILE:-./infra/backup/recipients.txt}
        target: /etc/backup/recipients.txt
        read_only: true
    # Plaintext dumps exist only in /tmp for the length of one backup, and /tmp is memory. The base image
    # declares its data directory a volume; this stops Docker creating an anonymous one for it.
    tmpfs:
      - /tmp
      - /var/lib/postgresql/data
    # The image's own healthcheck belongs to a database server. The signal for this service is task_runs.
    healthcheck:
      disable: true
    restart: unless-stopped

  heartbeat:
    # External dead-man sender (ADR-0008). No profile: it runs under private and public alike. Not
    # in §13's service list (IDEA-031). No ports: it only makes outbound calls, which is the point
    # of push over pull. No depends_on: an absent API must mean no pings, not a sender that waits.
    build: ./backend
    command: ["python", "-m", "app.heartbeat"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Blank on development machines, set only on a deployed instance (docs/HEARTBEAT.md).
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-300}
    # The image's HEALTHCHECK probes port 8000, which nothing serves here. Inherited, it would
    # report unhealthy forever and hang infra/lib.sh's wait_ready.
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  pgdata:
  backups:
  beat_schedule:
