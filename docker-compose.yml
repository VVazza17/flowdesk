# x- keys are ignored by Compose; the anchors let api and api-public share one definition, so the
# two profiles cannot drift apart. `environment` is a separate anchor because `<<` merges only one
# level deep: each service's own `environment` would otherwise replace the shared one outright.
x-api-env: &api-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Same URL-encoding caveat as migrate below; settings.py is where that gets fixed.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
  REDIS_URL: redis://redis:6379/0

x-api-base: &api-base
  build: ./backend
  # DECISION: no depends_on, on purpose. /health/live must stay up when Postgres or Redis
  # are down, and /health/ready reports their state (slice 6) rather than the API refusing
  # to start. Loopback only, like Postgres (M1 exit gate).
  ports:
    - "127.0.0.1:${API_PORT:-8000}:8000"
  # One name for whichever of api / api-public is running, so the heartbeat sender needn't know.
  networks:
    default:
      aliases: [api-upstream]
  restart: unless-stopped

services:
  postgres:
    # DECISION: exact tag, not latest-pg16. Verified with `docker buildx imagetools inspect`
    # to publish linux/amd64 and linux/arm64 (§13 targets an Oracle ARM VM).
    image: timescale/timescaledb:2.31.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only: host psql works, nothing is exposed externally (M1 exit gate).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # DECISION: -h 127.0.0.1 forces TCP. The entrypoint's temporary init server listens on
      # the unix socket only, so a socket check can report healthy before init has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    # DECISION: exact tag; amd64 + arm64/v8 verified. No persistence and no host port:
    # Redis is never the source of truth (Postgres is). Reach it with `docker compose exec redis`.
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Exactly one of the two API services runs (§14: "choose one; set by compose profile").
  # COMPOSE_PROFILES=private in .env keeps `docker compose up -d` the one command. Both publish
  # the same host port on purpose: enabling both profiles fails on the bind, not silently.
  api:
    <<: *api-base
    profiles: [private]
    environment:
      <<: *api-env
      DEPLOYMENT_MODE: private

  api-public:
    <<: *api-base
    # DECISION: loopback like everything else. The public profile is NOT internet-ready after
    # slice 7: strict CORS, request-size limits and rate limits do not exist yet (IDEA-019 addendum).
    profiles: [public]
    environment:
      <<: *api-env
      DEPLOYMENT_MODE: public

  migrate:
    # DECISION: a one-shot service, not a dependency of `api`. /health/live must stay up when
    # Postgres is down (slice 2), so the API never waits on migrations; slice 6's /health/ready
    # will report "migrations not applied" instead. restart "no" because it exits 0 by design.
    # DATABASE_URL is assembled here; a password with URL-reserved characters must be encoded.
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  heartbeat:
    # External dead-man sender (ADR-0008). No profile: it runs under private and public alike. Not
    # in §13's service list (IDEA-031). No ports: it only makes outbound calls, which is the point
    # of push over pull. No depends_on: an absent API must mean no pings, not a sender that waits.
    build: ./backend
    command: ["python", "-m", "app.heartbeat"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Blank on development machines, set only on a deployed instance (docs/HEARTBEAT.md).
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-300}
    # The image's HEALTHCHECK probes port 8000, which nothing serves here. Inherited, it would
    # report unhealthy forever and hang infra/lib.sh's wait_ready.
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  pgdata:
