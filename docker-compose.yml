services:
  postgres:
    # DECISION: exact tag, not latest-pg16. Verified with `docker buildx imagetools inspect`
    # to publish linux/amd64 and linux/arm64 (§13 targets an Oracle ARM VM).
    image: timescale/timescaledb:2.31.0-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only: host psql works, nothing is exposed externally (M1 exit gate).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # DECISION: -h 127.0.0.1 forces TCP. The entrypoint's temporary init server listens on
      # the unix socket only, so a socket check can report healthy before init has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    # DECISION: exact tag; amd64 + arm64/v8 verified. No persistence and no host port:
    # Redis is never the source of truth (Postgres is). Reach it with `docker compose exec redis`.
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    # DECISION: no depends_on, on purpose. /health/live must stay up when Postgres or Redis
    # are down, and /health/ready reports their state (slice 6) rather than the API refusing
    # to start. Loopback only, like Postgres (M1 exit gate).
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Same URL-encoding caveat as migrate below; settings.py is where that gets fixed.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
      REDIS_URL: redis://redis:6379/0
    restart: unless-stopped

  migrate:
    # DECISION: a one-shot service, not a dependency of `api`. /health/live must stay up when
    # Postgres is down (slice 2), so the API never waits on migrations; slice 6's /health/ready
    # will report "migrations not applied" instead. restart "no" because it exits 0 by design.
    # DATABASE_URL is assembled here; a password with URL-reserved characters must be encoded.
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
