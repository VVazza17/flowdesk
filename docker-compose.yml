# x- keys are ignored by Compose; the anchors let api and api-public share one definition, so the
# two profiles cannot drift apart. `environment` is a separate anchor because `<<` merges only one
# level deep: each service's own `environment` would otherwise replace the shared one outright.
x-api-env: &api-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # Same URL-encoding caveat as migrate below; settings.py is where that gets fixed.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
  REDIS_URL: redis://redis:6379/0
  # The API judges the worker canary's staleness, Beat schedules it: one variable feeds both, so they
  # cannot disagree about how often it runs (app/settings.py).
  CANARY_INTERVAL_SECONDS: ${CANARY_INTERVAL_SECONDS:-60}
  # How old the last backup may be before /health/data calls it stale (it never touches /health/ready).
  BACKUP_STALE_AFTER_HOURS: ${BACKUP_STALE_AFTER_HOURS:-36}

# The Postgres image is defined once, here. The backup container is built FROM it so its pg_dump is the
# server's own version, and records it in each manifest (the version trap, docs/BACKUP.md).
x-postgres-image: &postgres-image timescale/timescaledb:2.31.0-pg16

x-api-base: &api-base
  build: ./backend
  # DECISION: no depends_on, on purpose. /health/live must stay up when Postgres or Redis
  # are down, and /health/ready reports their state (slice 6) rather than the API refusing
  # to start. Loopback only, like Postgres (M1 exit gate).
  ports:
    - "127.0.0.1:${API_PORT:-8000}:8000"
  # One name for whichever of api / api-public is running, so the heartbeat sender needn't know.
  networks:
    default:
      aliases: [api-upstream]
  restart: unless-stopped

services:
  postgres:
    # DECISION: exact tag, not latest-pg16. Verified with `docker buildx imagetools inspect`
    # to publish linux/amd64 and linux/arm64 (§13 targets an Oracle ARM VM).
    image: *postgres-image
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only: host psql works, nothing is exposed externally (M1 exit gate).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # DECISION: -h 127.0.0.1 forces TCP. The entrypoint's temporary init server listens on
      # the unix socket only, so a socket check can report healthy before init has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    # DECISION: exact tag; amd64 + arm64/v8 verified. No persistence and no host port:
    # Redis is never the source of truth (Postgres is). Reach it with `docker compose exec redis`.
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Exactly one of the two API services runs (§14: "choose one; set by compose profile").
  # COMPOSE_PROFILES=private in .env keeps `docker compose up -d` the one command. Both publish
  # the same host port on purpose: enabling both profiles fails on the bind, not silently.
  api:
    <<: *api-base
    profiles: [private]
    environment:
      <<: *api-env
      DEPLOYMENT_MODE: private

  api-public:
    <<: *api-base
    # DECISION: loopback like everything else. The public profile is NOT internet-ready after
    # slice 7: strict CORS, request-size limits and rate limits do not exist yet (IDEA-019 addendum).
    profiles: [public]
    environment:
      <<: *api-env
      DEPLOYMENT_MODE: public

  migrate:
    # DECISION: a one-shot service, not a dependency of `api`. /health/live must stay up when
    # Postgres is down (slice 2), so the API never waits on migrations; slice 6's /health/ready
    # will report "migrations not applied" instead. restart "no" because it exits 0 by design.
    # DATABASE_URL is assembled here; a password with URL-reserved characters must be encoded.
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/${POSTGRES_DB:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Celery worker and Beat (M2 slice 1). No profile: they run under private and public alike. No
  # depends_on, like the API: Redis and Postgres being down is a state the health endpoints report,
  # and Celery retries the broker connection (broker_connection_retry_on_startup) instead of exiting.
  # No ports. The image's HEALTHCHECK probes port 8000, which nothing serves here, so it is disabled
  # as for the heartbeat sender. The health signal for these two is the canary in task_runs, read by
  # /health/ready: a process being up says nothing about whether it is working.
  worker:
    build: ./backend
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    restart: unless-stopped

  beat:
    build: ./backend
    # The schedule file goes in /tmp: the app directory is root-owned and the container runs as an
    # unprivileged user. Losing it on restart is harmless, Beat rebuilds it from the code.
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    restart: unless-stopped

  # Scheduled, encrypted backups with an off-box copy (M2 slice 2, IDEA-029). A container, like the
  # heartbeat sender, so that what it does is recorded in task_runs and visible on /health/data: a host
  # scheduler would be a second system none of our machinery sees. No ports, no profile, no depends_on
  # (Postgres being down is a failed attempt that is retried, not a reason to refuse to start).
  # What it needs from you, all in .env and all outside git: docs/BACKUP.md.
  backup:
    build:
      context: ./infra/backup
      args:
        POSTGRES_IMAGE: *postgres-image
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      PGDATABASE: ${POSTGRES_DB:?set in .env}
      POSTGRES_IMAGE: *postgres-image
      TZ: ${BACKUP_TZ:-America/New_York}
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_RETRY_MINUTES: ${BACKUP_RETRY_MINUTES:-15}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      # Blank host = no off-box copy: recorded as not_configured on /health/data, never as a success.
      BACKUP_SSH_HOST: ${BACKUP_SSH_HOST:-}
      BACKUP_SSH_USER: ${BACKUP_SSH_USER:-}
      BACKUP_SSH_PORT: ${BACKUP_SSH_PORT:-22}
      BACKUP_SSH_PATH: ${BACKUP_SSH_PATH:-.}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    volumes:
      # The encrypted backups kept locally. `docker compose down -v` wipes them with the database; the
      # off-box copy is what survives that.
      - backups:/backups
      # Long syntax, because a Windows path like C:/Users/... breaks the short form's colon parsing. The
      # default is an empty committed file, so an unset variable mounts nothing useful and ssh reports
      # "no SSH key" instead of Docker creating a directory by that name.
      - type: bind
        source: ${BACKUP_SSH_KEY_FILE:-./infra/backup/unset}
        target: /mnt/ssh_key
        read_only: true
      - type: bind
        source: ${BACKUP_SSH_KNOWN_HOSTS_FILE:-./infra/backup/unset}
        target: /mnt/known_hosts
        read_only: true
      - type: bind
        source: ${BACKUP_RECIPIENTS_FILE:-./infra/backup/recipients.txt}
        target: /etc/backup/recipients.txt
        read_only: true
    # Plaintext dumps exist only in /tmp for the length of one backup, and /tmp is memory. The base image
    # declares its data directory a volume; this stops Docker creating an anonymous one for it.
    tmpfs:
      - /tmp
      - /var/lib/postgresql/data
    # The image's own healthcheck belongs to a database server. The signal for this service is task_runs.
    healthcheck:
      disable: true
    restart: unless-stopped

  heartbeat:
    # External dead-man sender (ADR-0008). No profile: it runs under private and public alike. Not
    # in §13's service list (IDEA-031). No ports: it only makes outbound calls, which is the point
    # of push over pull. No depends_on: an absent API must mean no pings, not a sender that waits.
    build: ./backend
    command: ["python", "-m", "app.heartbeat"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Blank on development machines, set only on a deployed instance (docs/HEARTBEAT.md).
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-300}
    # The image's HEALTHCHECK probes port 8000, which nothing serves here. Inherited, it would
    # report unhealthy forever and hang infra/lib.sh's wait_ready.
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  pgdata:
  backups:
