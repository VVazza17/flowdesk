[alembic]
# %(here)s makes this independent of the working directory (host pytest and the container
# both work). No URL here: env.py reads DATABASE_URL so credentials never live in a file.
script_location = %(here)s/alembic
# env.py imports app.models; the `alembic` entry point does not put the project root on sys.path.
prepend_sys_path = %(here)s
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
